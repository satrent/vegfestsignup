<div class="closed-wrapper">
  <div class="closed-card">
    <div class="logo-container">
      <img src="/assets/veg_fest_logo.png" alt="Twin Cities Veg Fest" class="logo">
    </div>

    @if (loading) {
    <p class="help-text">Loading...</p>
    } @else {
    <h1>Registration Closed</h1>
    <p class="message">{{ message }}</p>
    <p class="help-text">
      Signed in with a different email than your registration? Sign out and try again.
    </p>
    <button class="btn btn-secondary" (click)="logout()">Sign Out</button>
    }
  </div>
</div>
